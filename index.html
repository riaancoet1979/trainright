<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- PWA / iOS home-screen -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TrainRight" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#4c3cdc" />

  <link rel="manifest" href="manifest.json" />

  <!-- iOS icons (Safari ignores manifest icons) -->
  <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />

  <link rel="stylesheet" href="styles.css" />

  <title>TrainRight</title>
</head>
<body>

  <!-- ─── App Shell ─────────────────────────────────────────────── -->
  <div id="app">

    <!-- Top bar (populated by JS) -->
    <header id="top-bar"></header>

    <!-- Main scrollable content area -->
    <main id="main-content" role="main"></main>

    <!-- Rest timer widget (sits above bottom nav) -->
    <div id="timer-widget" aria-live="polite"></div>

    <!-- Bottom navigation (populated by JS) -->
    <nav id="bottom-nav" role="navigation" aria-label="Main navigation"></nav>

  </div>

  <!-- ─── Toast notification ───────────────────────────────────── -->
  <div id="toast" role="status" aria-live="polite"></div>

  <!-- ─── Full-screen modal sheet ─────────────────────────────── -->
  <div id="modal-overlay" class="hidden" aria-modal="true" role="dialog"></div>

  <!-- ─── App logic ─────────────────────────────────────────────── -->
  <script src="app.js" defer></script>

</body>
</html>
